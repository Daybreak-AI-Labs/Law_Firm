# Cloudflare Tunnel config for the Daybreak vendor console.
# Usage: cloudflared tunnel --config deploy/cloudflare/cloudflared.yml run
# (after `cloudflared tunnel create daybreak-console` — see README.md)
tunnel: daybreak-console
credentials-file: /root/.cloudflared/daybreak-console.json

ingress:
  - hostname: console.daybreak.example
    service: http://localhost:8900
    originRequest:
      # cloudflared → console is loopback; the console sees real client IPs
      # via CF-Connecting-For headers (VENDOR_CONSOLE_TRUST_PROXY=1).
      noTLSVerify: false
  # Everything else 404s — the tunnel publishes exactly one app.
  - service: http_status:404
