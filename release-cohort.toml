schema_version = 1
version = "0.1.7"
repository = "Daybreak-AI-Labs/Law_Firm"

# The five retained Python distributions are built, tested, and installed as
# one lockstep private cohort. Build and validation tooling consume this manifest
# instead of maintaining independent package lists.

[[packages]]
distribution = "maverick-agent"
path = "packages/maverick-core"
runtime_module = "maverick"

[[packages]]
distribution = "maverick-shield"
path = "packages/maverick-shield"
runtime_module = "maverick_shield"

[[packages]]
distribution = "maverick-dashboard"
path = "packages/maverick-dashboard"
runtime_module = "maverick_dashboard"

[[packages]]
distribution = "maverick-knowledge"
path = "packages/maverick-knowledge"
runtime_module = "maverick_knowledge"

[[packages]]
distribution = "maverick-installer"
path = "apps/installer-cli"
runtime_module = "maverick_installer"
