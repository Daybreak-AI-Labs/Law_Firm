name: Native (Rust)

# Builds and tests the native scanner core (rust/). Two outputs from one core:
#   - the `maverick_native` Python wheel (PyO3, abi3) — accelerates the shield
#     scanners; absent => pure-Python fallback, so this is additive.
#   - the `mvk-scan-wasm` package (wasm-bindgen) — TypeScript / edge.
# The whole point: CI here *exercises the native path* (the parity tests skip in
# the main suite because the wheel isn't built there). The wheel is retained only
# as a short-lived GitHub Actions artifact for debugging this CI run; this
# workflow does not publish release assets or write to a package registry.

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - "rust/**"
      - "packages/maverick-core/maverick/safety/unicode_filter.py"
      - "packages/maverick-core/maverick/safety/secret_detector.py"
      - "packages/maverick-core/maverick/safety/pii_detector.py"
      - "packages/maverick-core/maverick/__init__.py"
      - "packages/maverick-core/maverick/safety/__init__.py"
      - "packages/maverick-core/pyproject.toml"
      # The audit verifier is a byte-exact port of verify_chain; rerun its
      # cross-language parity job whenever the signing source of truth changes.
      - "packages/maverick-core/maverick/audit/signing.py"
      - "packages/maverick-core/tests/test_native_unicode_parity.py"
      - "packages/maverick-core/tests/test_native_detect_parity.py"
      - "requirements/ci.txt"
      - "scripts/verify_constraint_closure.py"
      - "rust-toolchain.toml"
      - ".github/workflows/native.yml"

permissions:
  contents: read

# A new push to the same ref supersedes in-flight runs.
concurrency:
  group: native-${{ github.ref }}
  cancel-in-progress: true

env:
  RUST_BACKTRACE: "1"
  PIP_CONSTRAINT: ${{ github.workspace }}/requirements/ci.txt

jobs:
  core:
    name: cargo test (core crate)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8
        with:
          toolchain: "1.97.1"
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          workspaces: rust
      # Just the core crate: all behaviour + unit tests live here. The binding
      # crates (pyo3 cdylib, wasm-bindgen) have no host-target tests and are
      # exercised by the python/wasm parity jobs below.
      - run: cargo test -p mvk-scan --manifest-path rust/Cargo.toml --locked

  verify-audit:
    name: maverick-verify-audit (build + cross-lang parity)
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8
        with:
          toolchain: "1.97.1"
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          workspaces: rust
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12.13"
      # Rust unit tests (canonical-JSON parity table + chain-break logic).
      - run: >-
          cargo test -p maverick-verify-audit
          --manifest-path rust/Cargo.toml --locked
      - run: >-
          cargo build -p maverick-verify-audit --release
          --manifest-path rust/Cargo.toml --locked
      # Cross-language parity: drive the REAL Python AuditSigner to sign a log,
      # run the binary on it, and assert the Rust verdict matches Python's
      # verify_chain (intact -> exit 0; flipped byte -> break at the right row;
      # unsigned -> UNVERIFIABLE). cryptography is required for the Python side.
      - name: Cross-language parity (Rust binary == Python verify_chain)
        run: |
          set -euo pipefail
          python -I -m pip install --upgrade \
            'pip==26.1.2' 'setuptools==83.0.0' 'wheel==0.47.0' \
            'packaging==26.2'
          python -I -m pip install -e packages/maverick-core --no-deps
          python -I -m pip install 'cryptography==50.0.0'
          python -I scripts/verify_constraint_closure.py
          MVK_VERIFY_BIN="$PWD/rust/target/release/maverick-verify-audit" \
            python -I rust/maverick-verify-audit/tests/parity.py

  python:
    name: wheel + native parity (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12.10"
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8
        with:
          toolchain: "1.97.1"
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          workspaces: rust
      - name: Anchor native artifacts to the source commit
        shell: bash
        run: |
          set -euo pipefail
          epoch="$(git show -s --format=%ct HEAD)"
          [[ "$epoch" =~ ^[0-9]+$ ]]
          echo "SOURCE_DATE_EPOCH=$epoch" >> "$GITHUB_ENV"
          echo "PYTHONHASHSEED=0" >> "$GITHUB_ENV"
          echo "CARGO_INCREMENTAL=0" >> "$GITHUB_ENV"
          # Rust's own MSVC determinism test uses /Brepro to replace PE/COFF
          # and debug-directory timestamps with deterministic content hashes.
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            echo "RUSTFLAGS=-C link-arg=/Brepro" >> "$GITHUB_ENV"
          fi
      # Build once into the directory used by the parity test. The wheel is a CI
      # diagnostic artifact, not a published distribution.
      - name: Build the maverick_native wheel
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1
        env:
          CARGO_TARGET_DIR: ${{ runner.temp }}/maverick-native-target
        with:
          command: build
          args: --release --locked -m rust/mvk-scan-py/Cargo.toml --out dist
          maturin-version: v1.14.1
      - name: Install wheel + assert native engaged + run parity
        shell: bash
        run: |
          set -euo pipefail
          python -I - <<'PY'
          import hashlib
          import os
          from pathlib import Path

          wheels = sorted(Path("dist").glob("*.whl"))
          if len(wheels) != 1:
              raise SystemExit(f"expected exactly one wheel, found {len(wheels)}")
          wheel = wheels[0]
          digest = hashlib.sha256(wheel.read_bytes()).hexdigest()
          checksum = Path(os.environ["RUNNER_TEMP"]) / "maverick-native-wheel.sha256"
          checksum.write_text(
              f"{wheel.name}\n{digest}\n",
              encoding="utf-8",
          )
          print(f"captured {wheel.name}: sha256:{digest}")
          PY
          # setup-python's Windows image carries runner-owned pipx packages in
          # the global environment. Verify dependency closure inside a fresh
          # venv so image contents cannot contaminate the parity check.
          python -I -m venv .native-parity-venv
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            parity_python=".native-parity-venv/Scripts/python.exe"
          else
            parity_python=".native-parity-venv/bin/python"
          fi
          "$parity_python" -I -m pip install --upgrade \
            'pip==26.1.2' 'setuptools==83.0.0' 'wheel==0.47.0' \
            'packaging==26.2' 'pytest==9.1.1' 'certifi==2026.7.22'
          # --no-index forces the install to use the wheel we just built; if no
          # wheel matches this OS/Python the install fails hard (not a silent skip).
          "$parity_python" -I -m pip install \
            --no-index --find-links dist maverick-native
          # Make `maverick` importable so the shim under test loads (deps-free:
          # maverick.safety.unicode_filter pulls only stdlib).
          "$parity_python" -I -m pip install -e packages/maverick-core --no-deps
          "$parity_python" -I scripts/verify_constraint_closure.py \
            --allow-unconstrained maverick-native
          # HARD GATE: the parity tests self-skip when the native module is
          # absent. After explicitly building+installing it, a skip would be a
          # false green — so prove the extension imported and exposes every entry
          # point before we let pytest run. The unicode scanner IS wired into the
          # Python hot path (a real accelerator), so assert its shim swapped in;
          # the secret/PII detectors are deliberately NOT (CPython `re` is faster
          # — see rust/README.md), so assert the extension functions merely exist.
          "$parity_python" -I - <<'PY'
          import maverick_native as n
          from maverick.safety import unicode_filter as uf
          assert uf._native is not None, "shim did not pick up maverick_native"
          assert uf.normalize is not uf._normalize_py, "native normalize not engaged"
          assert uf.has_dangerous_unicode is not uf._has_dangerous_unicode_py, (
              "native has_dangerous_unicode not engaged"
          )
          assert hasattr(n, "secret_scan_spans"), "missing native secret_scan_spans"
          assert hasattr(n, "pii_scan_spans"), "missing native pii_scan_spans"
          print("native present:", n.__file__)
          PY
          "$parity_python" -I -m pytest \
            packages/maverick-core/tests/test_native_unicode_parity.py \
            packages/maverick-core/tests/test_native_detect_parity.py \
            -vv
          "$parity_python" -I - <<'PY'
          import hashlib
          import os
          from pathlib import Path

          checksum = Path(os.environ["RUNNER_TEMP"]) / "maverick-native-wheel.sha256"
          name, expected = checksum.read_text(encoding="utf-8").splitlines()
          wheel = Path("dist") / name
          actual = hashlib.sha256(wheel.read_bytes()).hexdigest()
          if actual != expected:
              raise SystemExit(
                  f"wheel mutated during parity testing: {expected} != {actual}"
              )
          print(f"wheel unchanged after parity testing: sha256:{actual}")
          PY
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: maverick-native-wheel-${{ matrix.os }}
          path: dist/*.whl
          if-no-files-found: error
