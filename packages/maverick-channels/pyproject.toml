[build-system]
requires = ["setuptools==83.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "maverick-channels"
version = "0.1.7"
description = "Channel adapters for Lightwork (Telegram, Discord, Slack, Signal, ...)"
requires-python = ">=3.10"
license = "LicenseRef-Proprietary"
authors = [{ name = "cdayAI" }]
readme = "README.md"
dependencies = [
    "maverick-agent>=0.1.7",
]

[project.optional-dependencies]
telegram = ["python-telegram-bot>=21.0"]
discord  = ["discord.py>=2.4", "aiohttp>=3.14.1"]
slack    = ["slack_sdk>=3.27"]
matrix   = ["matrix-nio>=0.24", "aiohttp>=3.14.1"]
# Starlette and python-multipart are FastAPI's untrusted HTTP parsing surface.
# requests>=2.33.0 / urllib3>=2.7.0 patch CVE-2026-25645 and
# PYSEC-2026-142/141; those dependencies enter via Twilio.
whatsapp = ["fastapi>=0.110", "uvicorn>=0.27", "twilio>=9.0", "python-multipart>=0.0.31", "starlette>=1.3.1", "requests>=2.33.0", "urllib3>=2.7.0", "aiohttp>=3.14.1"]
whatsapp-cloud = ["fastapi>=0.110", "uvicorn>=0.27", "httpx>=0.27", "starlette>=1.3.1"]
threads = ["httpx>=0.27"]
rcs = ["fastapi>=0.110", "uvicorn>=0.27", "httpx>=0.27", "google-auth>=2.0", "starlette>=1.3.1"]
sms      = ["fastapi>=0.110", "uvicorn>=0.27", "twilio>=9.0", "python-multipart>=0.0.31", "starlette>=1.3.1", "requests>=2.33.0", "urllib3>=2.7.0", "aiohttp>=3.14.1"]
voice    = ["fastapi>=0.110", "uvicorn>=0.27", "httpx>=0.27", "starlette>=1.3.1"]
bluesky  = ["httpx>=0.27"]
mastodon = ["httpx>=0.27"]
all = [
    "python-telegram-bot>=21.0",
    "discord.py>=2.4",
    "aiohttp>=3.14.1",
    "slack_sdk>=3.27",
    "matrix-nio>=0.24",
    "fastapi>=0.110",
    "uvicorn>=0.27",
    "twilio>=9.0",
    "python-multipart>=0.0.31",
    "httpx>=0.27",
    "starlette>=1.3.1",
    "requests>=2.33.0",
    "urllib3>=2.7.0",
]

[project.urls]
Homepage = "https://github.com/Daybreak-AI-Labs/Lightwork"

[tool.setuptools.packages.find]
where = ["."]
include = ["maverick_channels*"]
