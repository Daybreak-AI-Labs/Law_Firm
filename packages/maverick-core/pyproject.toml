[build-system]
requires = ["setuptools==83.0.0"]
build-backend = "setuptools.build_meta"

[project]
# Internal distribution identifier for the firm's reviewed wheel cohort.  The
# Python import remains ``maverick`` and the operator CLI remains ``maverick``.
name = "maverick-agent"
version = "0.1.7"
description = "Governed matter-bound agent kernel for law firms"
requires-python = ">=3.10"
license = "LicenseRef-Proprietary"
authors = [{ name = "cdayAI" }]
readme = "README.md"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "anthropic>=0.40.0",
    "click>=8.3.3",
    "httpx>=0.27",
    # idna is pulled transitively (httpx/anthropic); floor it past PYSEC-2026-215
    # / GHSA-65pc-fj4g-8rjx so a fresh install can't resolve a vulnerable <3.15.
    # Required for secure-by-default at-rest encryption; without AES-GCM support
    # normal persistence writes would fail when encryption is default-enabled.
    "cryptography>=48.0.1",
    "idna>=3.15",
    "tomli>=2.0; python_version<'3.11'",
    # zoneinfo has no bundled database on Windows and minimal Linux images may
    # omit the system database. Time-based firm policy requires IANA zones.
    "tzdata>=2026.3",
]

[project.optional-dependencies]
openai     = ["openai>=1.30"]
release-runtime = ["openai>=1.30"]
azure      = ["openai>=1.30", "azure-identity>=1.25.3,<2"]
openrouter = ["openai>=1.30"]
ollama     = ["openai>=1.30"]
moonshot   = ["openai>=1.30"]
deepseek   = ["openai>=1.30"]
xai        = ["openai>=1.30"]
gemini     = ["openai>=1.30"]
tgi        = ["openai>=1.30"]
vllm       = ["openai>=1.30"]
queue      = ["arq>=0.25"]
perf-fastjson = ["orjson>=3.9"]
parsers         = ["pdfplumber>=0.10", "pypdf>=6.15.0", "pillow>=12.3.0"]
audit-signing   = ["cryptography>=48.0.1"]
oidc            = ["pyjwt[crypto]>=2.13.0"]
# Optional CPU inference for the retained, artifact-validated LearnedPRM.
# LinearPRM and its governed offline trainer use only the standard library.
training        = ["torch>=2.2"]
spreadsheet     = ["openpyxl>=3.1"]
redis           = ["redis>=5.0"]
s3              = ["boto3>=1.34"]
observability   = [
    "opentelemetry-api>=1.25",
    "opentelemetry-sdk>=1.25",
    "opentelemetry-exporter-otlp-proto-http>=1.25",
    "prometheus-client>=0.20",
]
sentry          = ["sentry-sdk>=2.0"]
shield          = ["maverick-shield>=0.1.7"]
installer  = ["maverick-installer>=0.1.7"]
dashboard  = ["maverick-dashboard>=0.1.7"]
knowledge  = ["maverick-knowledge>=0.1.7"]
embeddings = ["fastembed>=0.3"]
# Full dev/test bootstrap. Beyond the test runner + linter, this bundles the
# cross-package runtime deps the suite imports -- the sibling packages are
# installed `--no-deps`, so their web-stack deps won't come in
# otherwise. Versions mirror the CVE-patched floors the CI `test`/`audit` jobs
# enforce (see .github/workflows/ci.yml). Keeps `pip install -e .[dev]`
# runnable end-to-end so `pytest` passes from a clean checkout.
dev        = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
    "pre-commit",
    "questionary>=2.0",
    "rich>=13.7",
    "fastapi>=0.110",
    "uvicorn>=0.27",
    "jinja2>=3.1",
    "httpx>=0.27",
    "python-multipart>=0.0.31",
    "starlette>=1.3.1",
    "requests>=2.33.0",
    "urllib3>=2.7.0",
    "pillow>=12.3.0",
]
all        = [
    "openai>=1.30",
    "fastembed>=0.3",
    "maverick-shield>=0.1.7",
    "maverick-installer>=0.1.7",
    "maverick-dashboard>=0.1.7",
    "maverick-knowledge>=0.1.7",
]

[project.scripts]
maverick = "maverick.cli:main"

[project.urls]
Homepage      = "https://github.com/Daybreak-AI-Labs/Law_Firm"
Repository    = "https://github.com/Daybreak-AI-Labs/Law_Firm"
Issues        = "https://github.com/Daybreak-AI-Labs/Law_Firm/issues"
Changelog     = "https://github.com/Daybreak-AI-Labs/Law_Firm/blob/main/CHANGELOG.md"
Documentation = "https://github.com/Daybreak-AI-Labs/Law_Firm/tree/main/docs"

[tool.setuptools.packages.find]
where = ["."]
include = ["maverick*"]

[tool.setuptools.package-data]
# Ship the domain packs and the first-party skills library as package data so
# they are present in a built wheel, not only an editable/source checkout.
"maverick" = [
    "data/*.json",
    "domains/*.toml",
    "skills_builtin/*.md",
]
"maverick.env_hunt" = ["rules/*.yml"]
