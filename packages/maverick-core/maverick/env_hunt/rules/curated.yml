id: LW-SIGMA-001
title: Cloud console login without MFA
description: Potential initial access through an account without MFA.
logsource:
  product: aws
  service: cloudtrail
detection:
  selection:
    action: ConsoleLogin
    mfa: No
  condition: selection
tags:
  - attack.t1078
level: high
