[build-system]
requires = ["setuptools==84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "maverick-knowledge"
version = "0.1.7"
description = "Per-domain document knowledge (vector RAG) for Lightwork agents"
requires-python = ">=3.10"
license = "LicenseRef-Proprietary"
authors = [{ name = "cdayAI" }]
# Pure core (chunking, SQLite brute-force store, deterministic embedder,
# text/markdown/HTML parsing) has no third-party deps. Real embedding providers,
# richer parsers, and pgvector are opt-in extras so the kernel never has to pull
# heavy deps to run (CLAUDE.md rules 1 & 5).
dependencies = []

[project.optional-dependencies]
hosted = ["httpx>=0.27"]
local = ["sentence-transformers>=2.2"]
parsers = ["pypdf>=6.14.2", "python-docx>=1.1"]
vision = ["pytesseract>=0.3", "pillow>=12.3.0"]
pgvector = ["psycopg[binary]>=3.1"]
qdrant = ["qdrant-client>=1.7"]

[project.urls]
Homepage = "https://github.com/Daybreak-AI-Labs/Lightwork"

[tool.setuptools.packages.find]
where = ["."]
include = ["maverick_knowledge*"]
