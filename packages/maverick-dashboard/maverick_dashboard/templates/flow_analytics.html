{% extends "base.html" %}
{% block title %}Flow Analytics · Bjerken and Day{% endblock %}
{% block content %}
<style>
  .fa { max-width: 940px; }
  .fa__sub { color: var(--muted); font-size: var(--text-sm); margin-bottom: var(--space-4); }
  .fa__table { width: 100%; border-collapse: collapse; font-size: var(--text-sm); }
  .fa__table th, .fa__table td { text-align: left; padding: 6px 10px; border-bottom: 1px solid var(--border); }
  .fa__table th { color: var(--muted); font-weight: var(--font-semibold); }
  .fa__table td.num { text-align: right; font-variant-numeric: tabular-nums; }
  .fa__rate { font-weight: var(--font-semibold); }
  .fa__rate.good { color: var(--success, #16a34a); }
  .fa__rate.bad { color: var(--danger, #dc2626); }
  .fa__err { color: var(--muted); font-size: 12px; }
  .fa__msg { color: var(--muted); font-size: var(--text-sm); }
  .fa__bar { display: inline-block; height: 8px; background: var(--success, #16a34a); border-radius: 4px; vertical-align: middle; }
  .fa__bar-bg { display: inline-block; width: 60px; height: 8px; background: var(--surface-sunken); border-radius: 4px; overflow: hidden; }
</style>

<div class="fa">
  <h1 class="page-title" style="margin:0 0 4px;">Flow analytics</h1>
  <p class="fa__sub">Success rate, throughput, and duration across recent runs of each flow.
    <a href="/automations">Automations</a></p>
  <p class="fa__msg" id="fa-msg">Loading…</p>
  <div style="overflow-x:auto;">
    <table class="fa__table" id="fa-table" hidden>
      <thead><tr>
        <th>Flow</th><th class="num">Runs</th><th>Success</th>
        <th class="num">✓</th><th class="num">✗</th><th class="num">⏸</th>
        <th class="num">p50</th><th class="num">p95</th><th>Top errors</th>
      </tr></thead>
      <tbody id="fa-body"></tbody>
    </table>
  </div>
</div>

<script>
(function () {
  'use strict';
  var msg = document.getElementById('fa-msg');
  {% include "_dash_helpers.js" %}
  function pct(x) { return x == null ? '—' : Math.round(x * 100) + '%'; }
  function secs(x) { return (x || x === 0) ? (x < 1 ? Math.round(x * 1000) + 'ms' : x.toFixed(1) + 's') : '—'; }

  api('/api/v1/flows/analytics').then(function (r) {
    if (r.status === 403) { msg.textContent = 'The flow engine is off.'; return { off: true }; }
    return r.ok ? r.json() : null;
  }).then(function (j) {
    if (j && j.off) { return; }               // 403 message already shown
    if (!j) { msg.textContent = 'Could not load analytics.'; return; }
    var flows = j.flows || [];
    if (!flows.length) { msg.textContent = 'No flow runs yet.'; return; }
    msg.textContent = flows.length + ' flow' + (flows.length === 1 ? '' : 's') + ' · ' + j.run_window + ' runs in window';
    var body = document.getElementById('fa-body');
    flows.forEach(function (f) {
      var tr = document.createElement('tr');
      var nameTd = el('td');
      var a = document.createElement('span'); a.textContent = f.flow_id;
      nameTd.appendChild(a); tr.appendChild(nameTd);
      tr.appendChild(el('td', 'num', String(f.runs)));
      var rate = el('td');
      var span = el('span', 'fa__rate ' + (f.success_rate == null ? '' : (f.success_rate >= 0.9 ? 'good' : f.success_rate < 0.5 ? 'bad' : '')), pct(f.success_rate));
      rate.appendChild(span); tr.appendChild(rate);
      tr.appendChild(el('td', 'num', String(f.completed)));
      tr.appendChild(el('td', 'num', String(f.failed)));
      tr.appendChild(el('td', 'num', String(f.paused)));
      tr.appendChild(el('td', 'num', secs(f.p50_seconds)));
      tr.appendChild(el('td', 'num', secs(f.p95_seconds)));
      var errTd = el('td', 'fa__err');
      (f.top_errors || []).forEach(function (e) {
        errTd.appendChild(el('div', null, '×' + e.count + ' ' + e.error));
      });
      tr.appendChild(errTd);
      body.appendChild(tr);
    });
    document.getElementById('fa-table').hidden = false;
  }).catch(function () { msg.textContent = 'Could not load analytics.'; });
})();
</script>
{% endblock %}
