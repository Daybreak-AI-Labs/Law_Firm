[build-system]
requires = ["setuptools==83.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "maverick-dashboard"
version = "0.1.7"
description = "Matter-bound law-firm dashboard + REST API for Maverick"
requires-python = ">=3.10"
license = "LicenseRef-Proprietary"
authors = [{ name = "cdayAI" }]
readme = "README.md"
dependencies = [
    "maverick-agent>=0.1.7",
    "fastapi>=0.110",
    "uvicorn>=0.27",
    "jinja2>=3.1",
    "python-multipart>=0.0.31",
    # starlette is FastAPI's HTTP/multipart core (imported directly by
    # app.py). Keep this at the highest patched advisory floor.
    "starlette>=1.3.1",
]

[project.urls]
Homepage = "https://github.com/Daybreak-AI-Labs/Law_Firm"

[project.scripts]
maverick-dashboard = "maverick_dashboard.app:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["maverick_dashboard*"]

[tool.setuptools.package-data]
maverick_dashboard = ["templates/*.html", "static/*"]
