[build-system]
requires = ["setuptools==83.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "maverick-shield"
version = "0.1.7"
description = "Agent Shield integration + builtin fallback rules for Maverick"
requires-python = ">=3.10"
license = "LicenseRef-Proprietary"
authors = [{ name = "cdayAI" }]
readme = "README.md"
# Built-in rules ship as part of this package. agent-shield SDK is opt-in.
dependencies = []

[project.optional-dependencies]
scan = ["agent-shield>=14.0"]

[project.urls]
Homepage = "https://github.com/Daybreak-AI-Labs/Law_Firm"

[tool.setuptools.packages.find]
where = ["."]
include = ["maverick_shield*"]

[tool.setuptools.package-data]
# Ship the red-team corpus inside wheels (editable installs read it from disk).
maverick_shield = ["redteam_corpus.jsonl"]
