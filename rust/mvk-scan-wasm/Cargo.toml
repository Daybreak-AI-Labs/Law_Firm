[package]
name = "mvk-scan-wasm"
version.workspace = true
edition.workspace = true
# Literal (not `license.workspace = true`): wasm-pack reads this manifest with
# its own parser, which does NOT resolve Cargo workspace inheritance and errors
# "invalid type: map, expected a string for key package.license". Cargo itself
# (the other Rust jobs) resolves the inherited value fine; only wasm-pack needs
# the literal. Must stay in sync with [workspace.package] license in rust/Cargo.toml.
license = "LicenseRef-Proprietary"
description = "wasm-bindgen binding for the Maverick native safety scanners (TypeScript / edge)."
repository = "https://github.com/Daybreak-AI-Labs/Law_Firm"

[lib]
crate-type = ["cdylib"]

[dependencies]
mvk-scan = { path = "../mvk-scan" }
wasm-bindgen = "0.2"
serde = { version = "1", features = ["derive"] }
serde-wasm-bindgen = "0.6"

# The wasm-opt (binaryen) post-pass is an optional size optimization; disable it
# so the build is hermetic and doesn't need to download a binaryen release.
[package.metadata.wasm-pack.profile.release]
wasm-opt = false
