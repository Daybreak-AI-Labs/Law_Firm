[build-system]
requires = ["setuptools>=83.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "daybreak-vendor-console"
version = "0.1.0"
description = "Daybreak internal control plane — customers, licenses, updates, support (NOT shipped to clients)"
requires-python = ">=3.10"
license = { text = "LicenseRef-Proprietary" }
authors = [{ name = "Daybreak Labs" }]
# Reuses the product's own crypto (maverick.entitlements Ed25519 signing) so a
# license this console issues verifies with the exact code a customer runs.
# Auth (password/TOTP/sessions) is stdlib-only — no bcrypt/pyotp/itsdangerous.
dependencies = [
    "maverick-agent>=0.1.7",
    "fastapi>=0.110",
    "uvicorn>=0.27",
    "jinja2>=3.1",
    "python-multipart>=0.0.31",
    "starlette>=1.3.1",
]

[project.scripts]
daybreak-console = "vendor_console.app:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["vendor_console*"]

[tool.setuptools.package-data]
vendor_console = ["templates/*.html", "static/*"]
