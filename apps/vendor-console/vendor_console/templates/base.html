<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>{% block title %}Daybreak Console{% endblock %}</title>
  <link rel="stylesheet" href="/static/app.css">
</head>
<body>
{% if staff %}
<div class="shell">
  <aside class="sidebar">
    <div class="brand">◐ Daybreak<span>control plane</span></div>
    <nav>
      <a href="/customers" class="{% if section=='customers' %}on{% endif %}">Customers</a>
      <a href="/releases" class="{% if section=='releases' %}on{% endif %}">Releases</a>
      <a href="/support" class="{% if section=='support' %}on{% endif %}">Support desk</a>
      <a href="/fleet" class="{% if section=='fleet' %}on{% endif %}">Fleet health</a>
      {% if staff.can_write %}<a href="/audit" class="{% if section=='audit' %}on{% endif %}">Audit log</a>{% endif %}
    </nav>
    <div class="who">
      <div class="email">{{ staff.email }}</div>
      <div class="role">{{ staff.role }}</div>
      <form method="post" action="/logout"><button class="link">Sign out</button></form>
    </div>
  </aside>
  <main class="main">
    {% block main %}{% endblock %}
  </main>
</div>
{% else %}
  <div class="auth-wrap">{% block auth %}{% endblock %}</div>
{% endif %}
</body>
</html>
