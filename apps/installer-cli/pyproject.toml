[build-system]
requires = ["setuptools==83.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "maverick-installer"
version = "0.1.7"
description = "Interactive setup wizard for Lightwork"
requires-python = ">=3.10"
license = "LicenseRef-Proprietary"
authors = [{ name = "cdayAI" }]
readme = "README.md"
dependencies = [
    "maverick-agent>=0.1.7",
    "questionary>=2.0",
    "rich>=13.7",
]

[project.urls]
Homepage = "https://github.com/Daybreak-AI-Labs/Lightwork"

[project.scripts]
maverick-init = "maverick_installer.main:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["maverick_installer*"]
