site_name: Bjerken and Day
site_description: Internal engineering documentation for the firm's practice platform.
repo_url: https://github.com/Daybreak-AI-Labs/Law_Firm
repo_name: Daybreak-AI-Labs/Law_Firm
edit_uri: edit/main/docs/
copyright: Proprietary and confidential. Internal documentation for Bjerken and Day.

theme:
  name: material
  language: en
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.expand
    - navigation.top
    - navigation.indexes
    - navigation.footer
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.code.annotate
    - content.action.edit
    - content.action.view
    - toc.follow
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: blue grey
      accent: teal
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: blue grey
      accent: teal
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  icon:
    repo: fontawesome/brands/github
    edit: material/pencil
    view: material/eye

plugins:
  - search:
      lang: en

# Many engineering and assurance pages intentionally cite versioned source,
# workflow, and benchmark artifacts outside MkDocs' docs_dir. MkDocs cannot
# validate those repository-relative targets, so retain the diagnostics as
# build information while keeping strict mode for every other warning class.
validation:
  links:
    not_found: info

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets:
      # Resolve --8<-- includes only inside docs_dir, so a page cannot inline
      # an arbitrary repository file.
      base_path:
        - !relative $docs_dir
      restrict_base_path: true
      check_paths: true
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.tilde

nav:
  - Home:
      - Welcome: index.md
      - Getting started: getting-started.md
      - Operator first run: operator-first-run.md
  - Guides:
      - Configuration: configuration.md
      - Pricing governance: pricing-governance.md
      - Environment variables: env-vars.md
      - Deployment: deployment.md
      - Reference architectures: reference-architectures.md
      - Operations: operations.md
      - Safety: safety.md
      - Governed execution: governed-execution.md
      - Plugins: plugins.md
      - Connectors: connectors.md
      - Starter goals: starter-goals.md
  - Reference:
      - API: api.md
      - gRPC API: grpc.md
      - External agents (BYOA): external-agents.md
      - External agent quickstart: clients/external-agent-quickstart.md
  - Performance:
      - Streaming parity: performance/streaming-parity.md
  - Security:
      - Security & GRC suite: SECURITY_GRC.md
      - Model Risk & AI Assurance: MODEL_RISK_ASSURANCE.md
      - AI Evidence-Ready Gateway: AI_EVIDENCE_GATEWAY.md
      - Governed model improvement: MODEL_IMPROVEMENT_PLATFORM.md
      - Threat model: security/threat-model.md
      - DGM evaluator evidence: security/dgm-evaluator-evidence.md
      - Capability attenuation (verified): security/capability-attenuation.md
      - Shield benchmark: security/shield-benchmark.md
      - Encryption at rest: encryption.md
      - Regulated deployment: regulated-deployment.md
      - Compliance assessments: compliance-assessments.md
      - Hardened deployment checklist: compliance/deployment/hardening-checklist.md
      - Agent threat hunting: threat-hunting.md
  - Design notes:
      - Oversight experience: ux/oversight-experience.md
  - Internal:
      - Observability integrations: integrations/observability-partners.md
      - Working on this repo: CONTRIBUTING.md
      - Security policy: SECURITY.md

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/Daybreak-AI-Labs/Law_Firm
  generator: false

# How to preview locally:
#   pip install 'mkdocs-material'
#   mkdocs serve
# Production build (gh-pages):
#   mkdocs gh-deploy --force
