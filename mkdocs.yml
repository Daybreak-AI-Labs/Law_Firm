site_name: Lightwork
site_description: Recursive multi-agent swarm. Drives Claude / GPT / Kimi / Grok / Gemini / Ollama from one kernel.
site_url: https://daybreak-ai-labs.github.io/Lightwork/
repo_url: https://github.com/Daybreak-AI-Labs/Lightwork
repo_name: Daybreak-AI-Labs/Lightwork
edit_uri: edit/main/docs/
copyright: Proprietary, commercially licensed (see LICENSE). Built for everyone, not just the technical few.

theme:
  name: material
  language: en
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.expand
    - navigation.top
    - navigation.indexes
    - navigation.footer
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.code.annotate
    - content.action.edit
    - content.action.view
    - toc.follow
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: deep purple
      accent: cyan
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: deep purple
      accent: cyan
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  icon:
    repo: fontawesome/brands/github
    edit: material/pencil
    view: material/eye

plugins:
  - search:
      lang: en

# Many engineering and assurance pages intentionally cite versioned source,
# workflow, and benchmark artifacts outside MkDocs' docs_dir. MkDocs cannot
# validate those repository-relative targets, so retain the diagnostics as
# build information while keeping strict mode for every other warning class.
validation:
  links:
    not_found: info

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets:
      # Resolve includes only inside the active docs_dir. The public overlay
      # changes docs_dir to .public-docs, so an allowlisted page cannot inline
      # internal repository documents with an --8<-- directive.
      base_path:
        - !relative $docs_dir
      restrict_base_path: true
      check_paths: true
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.tilde

